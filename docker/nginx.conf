server {
    listen 8530;
    listen [::]:8530;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Optional settings store (compose service `settings`, server/README.md).
    # The resolver and the variable defer the name lookup to request time,
    # so nginx also starts when no `settings` service exists: the route
    # then answers 502 and Panda keeps its settings in this browser only.
    location /api/settings {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $panda_settings http://settings:8531;
        # A variable proxy_pass without a URI part forwards the original
        # request URI unchanged.
        proxy_pass $panda_settings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    # Vite fingerprints these files; immutable caching is safe.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Panda uses hash routing, but the fallback also keeps direct static
    # paths safe if a non-hash route is introduced later.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
