# The Forgejo copy of .github/workflows/ci.yml. Forgejo reads this directory
# and ignores .github/workflows once it exists. GitHub ignores .forgejo, so
# the files in .github/workflows (ci.yml, pr-title.yml, deploy.yml and
# desktop.yml) are for GitHub Actions only, and GitHub Actions is off on the
# GitHub mirror of Panda. desktop.yml needs macOS and Windows runners, which
# the forge does not have.
#
# Keep the workflow name `CI` and the job names `test` and `container`:
# Forgejo posts the statuses `CI / test (pull_request)` and
# `CI / container (pull_request)`, and the protection of main requires
# those names.
#
# Each job runs on the label `ci-vm`: a fresh VM per job, destroyed after
# the job. The steps run in the VM itself as the user `runner`, which is in
# the `docker` group. The VM has Ubuntu 24.04, git, Docker and Node 24 in
# /usr/local. No cache survives from one VM to the next, so no step restores
# or saves a cache. No job reads a secret.
#
# Forgejo ignores `permissions:`. The key stays so the intent reads the same
# as the GitHub copy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ci-vm
    timeout-minutes: 30
    steps:
      # The mirror on code.forgejo.org holds the same commit as the GitHub pin.
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 仓库无 packageManager 字段,须显式指定版本(本地 11.22,lockfile v9)。
      # The mirror on code.forgejo.org holds the same commit as the GitHub pin.
      - uses: https://code.forgejo.org/pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      # e2e 以 process.execPath spawn test-agent 且不带 --experimental-sqlite,
      # node:sqlite 必须无 flag 可用,固着 Node 24(与本地开发版本一致)。
      # The VM image ships Node 24, so no setup-node step downloads it again.
      # This step fails if a new image changes the major version.
      - name: Check Node 24
        run: |
          node --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm --filter panda-test-agent typecheck

      # workspace 安装后 test-agent/node_modules 存在,deepagents WebSocket e2e
      # 自动启用;CI 无 .env,确定性剧本模型,无真实模型调用
      - run: pnpm test
      - run: pnpm --filter panda-test-agent test

  # Arcane deploys main as soon as main moves, so the image must be proven
  # before the merge. This job builds the image from the tree and smoke-tests
  # it on each pull request, in parallel with `test`, and again on each push
  # of main. The image is not published: it ends with the job's VM. Arcane
  # builds its own image from the same Dockerfile through compose.yaml.
  container:
    runs-on: ci-vm
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Arcane's compose build passes no PANDA_VERSION, so vite.config.ts
      # falls back to the package.json version. This build passes that same
      # version, so the app version in the image is the one Arcane deploys.
      # VCS_REF lets the smoke test check the revision label.
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The VM starts with an empty Docker store, so each build pulls the
      # base images and runs pnpm install again.
      - name: Build container
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Each job VM shares the host's public IP with every other job, and
          # Docker Hub refuses an anonymous pull from an IP that reached its
          # limit. The build pulls the base image, so the retry belongs around
          # the build. The plain progress keeps the pull error in the log.
          for attempt in 1 2 3; do
            if docker build \
              --progress=plain \
              --build-arg "PANDA_VERSION=$VERSION" \
              --build-arg "VCS_REF=$GITHUB_SHA" \
              --tag panda:ci \
              .; then
              exit 0
            fi
            echo "the image build failed on attempt $attempt"
            sleep 60
          done
          echo "::error::the image build failed three times"
          exit 1

      - name: Smoke-test container
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          container="$(docker run --detach --rm panda:ci)"
          trap 'docker stop "$container" >/dev/null' EXIT

          for attempt in {1..20}; do
            if [[ "$(docker exec "$container" wget -q -O - http://127.0.0.1:8530/healthz 2>/dev/null || true)" == "ok" ]]; then
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              docker logs "$container"
              echo "::error::container did not become healthy"
              exit 1
            fi
            sleep 1
          done

          docker exec "$container" wget -q -O /tmp/index.html http://127.0.0.1:8530/
          docker exec "$container" test -s /tmp/index.html
          docker exec "$container" grep -R -q -- "$VERSION" /usr/share/nginx/html/assets
          test "$(docker image inspect --format '{{.Config.User}}' panda:ci)" = "101"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' panda:ci)" = "$VERSION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' panda:ci)" = "$GITHUB_SHA"

  # After the tests and the smoke test of a push of main pass, the commit gets
  # one immutable panda-vX.Y.Z tag. The tag only records which main commits
  # passed: nothing deploys from it. A failed or superseded run creates no
  # tag. The job token pushes the tag, and its pushes start no new workflow
  # run. The job token cannot push a protected tag, so keep the panda-v*
  # tags out of any tag protection.
  release-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, container]
    runs-on: ci-vm
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Plan release tag
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          tip="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$tip" ]]; then
            echo "Current main is $tip; $GITHUB_SHA was superseded, so it gets no tag."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing="$(git tag --points-at "$GITHUB_SHA" --list 'panda-v*' | sort -V | tail -n 1)"
          if [[ -n "$existing" ]]; then
            tag="$existing"
            create=false
          else
            base="$(node -p "require('./package.json').version")"
            mapfile -t tags < <(git tag --list 'panda-v*')
            tag="$(node scripts/next-release-tag.mjs "$base" "${tags[@]}")"
            create=true
          fi

          version="${tag#panda-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::planned tag is not panda-vX.Y.Z: $tag"
            exit 1
          fi
          {
            echo "create=$create"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # The tagger is the job token's user, `forgejo-actions`. The address
      # is a placeholder that no mail reaches.
      - name: Create release tag
        if: steps.plan.outputs.create == 'true'
        shell: bash
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name forgejo-actions
          git config user.email forgejo-actions@noreply.invalid
          git tag --annotate "$TAG" "$GITHUB_SHA" --message "Panda $VERSION"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG at $GITHUB_SHA after the tests and the container smoke test passed." >> "$GITHUB_STEP_SUMMARY"
